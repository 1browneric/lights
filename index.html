<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lights</title>
<style>
  :root{
    --bg:#0D1117;
    --panel:#161C26;
    --line:#242E3D;
    --text:#E8EAED;
    --muted:#7E8A9A;
    --blue:#2E6FBF;
    --gold:#C9A158;
    --red:#C0392B;
    --green:#3E9B6A;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  /* Live glow bar ‚Äî mirrors current strip color */
  #glow{
    position:sticky;top:0;z-index:10;
    height:10px;width:100%;
    background:#222;
    transition:background .25s linear;
    box-shadow:0 0 24px 2px rgba(0,0,0,0);
  }
  header{
    padding:22px 20px 14px;
    display:flex;align-items:baseline;justify-content:space-between;
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;
    font-weight:400;font-size:30px;letter-spacing:.5px;
  }
  #status{
    font-family:ui-monospace,Menlo,monospace;
    font-size:12px;color:var(--muted);
  }
  #status.on{color:var(--green);}
  .wrap{padding:0 16px;}
  section{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
    margin-bottom:14px;
  }
  .label{
    font-family:Georgia,serif;
    font-size:13px;letter-spacing:2px;text-transform:uppercase;
    color:var(--gold);
    margin-bottom:12px;
  }
  button{
    font-family:inherit;font-size:16px;font-weight:600;
    border:none;border-radius:10px;
    padding:14px 18px;
    color:var(--text);
    background:var(--line);
    width:100%;
  }
  button:active{opacity:.7;}
  .btn-blue{background:var(--blue);}
  .btn-red{background:var(--red);}
  .row{display:flex;gap:10px;}
  .row button{flex:1;}
  /* color swatches */
  .swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;}
  .swatch{
    aspect-ratio:1;border-radius:50%;
    border:2px solid var(--line);
    width:100%;padding:0;
  }
  .picker-row{display:flex;align-items:center;gap:12px;margin-top:14px;}
  input[type=color]{
    width:54px;height:42px;border:none;border-radius:8px;
    background:none;padding:0;
  }
  .picker-row span{font-size:14px;color:var(--muted);}
  /* brightness */
  input[type=range]{
    width:100%;height:34px;
    -webkit-appearance:none;background:transparent;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:6px;border-radius:3px;background:var(--line);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:26px;height:26px;border-radius:50%;
    background:var(--text);margin-top:-10px;
  }
  /* pattern cards */
  .patterns{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .pattern-card{
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px;
    text-align:left;
    font-weight:600;font-size:15px;
  }
  .pattern-card .dots{display:flex;gap:5px;margin-top:8px;}
  .pattern-card .dot{width:14px;height:14px;border-radius:50%;}
  .pattern-card.active{border-color:var(--gold);}
  /* custom builder */
  .step{
    display:flex;align-items:center;gap:10px;
    padding:8px 0;border-bottom:1px solid var(--line);
  }
  .step input[type=color]{width:44px;height:36px;}
  .step input[type=number]{
    flex:1;font-family:ui-monospace,monospace;font-size:15px;
    background:var(--bg);border:1px solid var(--line);border-radius:8px;
    color:var(--text);padding:9px 10px;
  }
  .step .ms{font-size:12px;color:var(--muted);}
  .step .del{
    width:36px;height:36px;flex:none;border-radius:8px;
    background:var(--bg);color:var(--red);
    font-size:20px;font-weight:400;padding:0;
    border:1px solid var(--line);
  }
  .builder-controls{display:flex;gap:10px;margin-top:12px;}
  .builder-controls button{flex:1;font-size:14px;padding:11px;}
  .fade-row{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:14px;font-size:15px;
  }
  .toggle{
    width:52px;height:30px;border-radius:15px;flex:none;
    background:var(--line);position:relative;padding:0;
  }
  .toggle::after{
    content:"";position:absolute;top:3px;left:3px;
    width:24px;height:24px;border-radius:50%;
    background:var(--muted);transition:all .15s;
  }
  .toggle.on{background:var(--green);}
  .toggle.on::after{left:25px;background:#fff;}
  #stopBtn{margin-top:4px;}
  .note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:10px;}
</style>
</head>
<body>

<div id="glow"></div>

<header>
  <h1>Lights</h1>
  <div id="status">disconnected</div>
</header>

<div class="wrap">

  <section>
    <button id="connectBtn" class="btn-blue">Connect to lights</button>
    <div class="row" style="margin-top:10px;">
      <button id="onBtn">Power on</button>
      <button id="offBtn">Power off</button>
    </div>
  </section>

  <section>
    <div class="label">Solid color</div>
    <div class="swatches" id="swatches"></div>
    <div class="picker-row">
      <input type="color" id="picker" value="#004687">
      <span>Any color ‚Äî tap to pick</span>
    </div>
  </section>

  <section>
    <div class="label">Brightness</div>
    <input type="range" id="bright" min="1" max="100" value="100">
  </section>

  <section>
    <div class="label">Fourth of July</div>
    <div class="patterns" id="julyGrid"></div>
  </section>

  <section>
    <div class="label">Patterns</div>
    <div class="patterns" id="patternGrid"></div>
    <button id="stopBtn" class="btn-red" style="margin-top:12px;">Stop pattern</button>
  </section>

  <section>
    <div class="label">Build your own</div>
    <div id="steps"></div>
    <div class="builder-controls">
      <button id="addStep">Add step</button>
      <button id="runCustom" class="btn-blue">Run</button>
    </div>
    <div class="fade-row">
      <span>Fade between colors</span>
      <button class="toggle" id="fadeToggle"></button>
    </div>
    <div class="note">Each step is a color and how long it holds, in milliseconds. 1000 = one second. Your custom pattern saves automatically on this device.</div>
  </section>

</div>

<script>
/* ============ BLEDOM protocol ============ */
const SERVICE = 0xfff0;
const WRITE_CHAR = 0xfff3;

let device = null, charac = null;
let patternTimer = null;
let lastWrite = 0;

const statusEl = document.getElementById('status');
const glow = document.getElementById('glow');

function setStatus(text, on){
  statusEl.textContent = text;
  statusEl.className = on ? 'on' : '';
}

async function connect(){
  try{
    if(!navigator.bluetooth){
      alert('Bluetooth not available in this browser. Open this page in the Bluefy app.');
      return;
    }
    device = await navigator.bluetooth.requestDevice({
      filters:[{namePrefix:'BLEDOM'},{namePrefix:'ELK'}],
      optionalServices:[SERVICE]
    });
    device.addEventListener('gattserverdisconnected', ()=>{
      setStatus('disconnected', false);
      charac = null;
    });
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE);
    charac = await service.getCharacteristic(WRITE_CHAR);
    setStatus('connected: ' + (device.name || 'BLEDOM'), true);
  }catch(e){
    setStatus('disconnected', false);
    if(e.name !== 'NotFoundError') alert('Connect failed: ' + e.message);
  }
}

async function write(bytes){
  if(!charac) return;
  // throttle BLE writes to ~40ms minimum spacing
  const now = Date.now();
  if(now - lastWrite < 40) return;
  lastWrite = now;
  const data = new Uint8Array(bytes);
  try{
    if(charac.writeValueWithoutResponse) await charac.writeValueWithoutResponse(data);
    else await charac.writeValue(data);
  }catch(e){ /* swallow mid-pattern write errors */ }
}

function setColor(r,g,b, updateGlow=true){
  write([0x7e,0x00,0x05,0x03,r,g,b,0x00,0xef]);
  if(updateGlow){
    glow.style.background = `rgb(${r},${g},${b})`;
    glow.style.boxShadow = `0 0 28px 3px rgba(${r},${g},${b},0.55)`;
  }
}
function setBrightness(v){ write([0x7e,0x00,0x01,v,0x00,0x00,0x00,0x00,0xef]); }
function powerOn(){ write([0x7e,0x00,0x04,0xf0,0x00,0x01,0xff,0x00,0xef]); }
function powerOff(){
  stopPattern();
  write([0x7e,0x00,0x04,0x00,0x00,0x00,0xff,0x00,0xef]);
  glow.style.background = '#222';
  glow.style.boxShadow = 'none';
}

/* ============ helpers ============ */
function hexToRgb(hex){
  const n = parseInt(hex.slice(1),16);
  return [(n>>16)&255,(n>>8)&255,n&255];
}

/* ============ solid colors ============ */
const SWATCHES = ['#004687','#C09A5B','#E31837','#FFB81C','#FFFFFF','#64CCC9',
                  '#0051BA','#E8000D','#FFC58F','#3E9B6A','#FF6B1A','#000000'];
const swEl = document.getElementById('swatches');
SWATCHES.forEach(hex=>{
  const b = document.createElement('button');
  b.className = 'swatch';
  b.style.background = hex;
  if(hex==='#000000') b.style.borderColor = '#444';
  b.onclick = ()=>{ stopPattern(); const [r,g,bl]=hexToRgb(hex); setColor(r,g,bl); };
  swEl.appendChild(b);
});
document.getElementById('picker').addEventListener('input', e=>{
  stopPattern();
  const [r,g,b] = hexToRgb(e.target.value);
  setColor(r,g,b);
});

/* ============ brightness ============ */
document.getElementById('bright').addEventListener('input', e=>{
  setBrightness(parseInt(e.target.value));
});

/* ============ pattern engine ============ */
function stopPattern(){
  if(patternTimer){ clearTimeout(patternTimer); patternTimer = null; }
  document.querySelectorAll('.pattern-card').forEach(c=>c.classList.remove('active'));
}

function runPattern(steps, fade){
  stopPattern();
  let i = 0;
  if(!fade){
    const next = ()=>{
      const s = steps[i % steps.length];
      const [r,g,b] = hexToRgb(s.color);
      setColor(r,g,b);
      i++;
      patternTimer = setTimeout(next, s.ms);
    };
    next();
  }else{
    // fade: interpolate from each step color to the next over the step duration
    const TICK = 60;
    let from = hexToRgb(steps[0].color);
    const cycle = ()=>{
      const s = steps[i % steps.length];
      const to = hexToRgb(steps[(i+1) % steps.length].color);
      const ticks = Math.max(2, Math.floor(s.ms / TICK));
      let t = 0;
      const stepFade = ()=>{
        t++;
        const p = t / ticks;
        const r = Math.round(from[0] + (to[0]-from[0])*p);
        const g = Math.round(from[1] + (to[1]-from[1])*p);
        const b = Math.round(from[2] + (to[2]-from[2])*p);
        setColor(r,g,b);
        if(t < ticks){ patternTimer = setTimeout(stepFade, TICK); }
        else { from = to; i++; patternTimer = setTimeout(cycle, 0); }
      };
      stepFade();
    };
    cycle();
  }
}

/* ============ Fourth of July modes ============ */
const RED=[255,0,0], WHITE=[255,255,255], BLUE=[0,51,204];

function modeSlowGlow(){
  runPattern([
    {color:'#FF0000', ms:2500},
    {color:'#FFFFFF', ms:2500},
    {color:'#0033CC', ms:2500},
    {color:'#FFFFFF', ms:2500}
  ], true);
}

function modePulse(){
  // fade each color in from dark and back out, then next color
  const cols=[RED,WHITE,BLUE];
  const TICK=50, HALF=900, ticks=HALF/TICK;
  let ci=0, t=0, dir=1;
  const step=()=>{
    t+=dir;
    const p=Math.max(0,Math.min(1,t/ticks));
    const c=cols[ci];
    setColor(Math.round(c[0]*p),Math.round(c[1]*p),Math.round(c[2]*p));
    if(t>=ticks) dir=-1;
    else if(t<=0 && dir===-1){ dir=1; ci=(ci+1)%cols.length; }
    patternTimer=setTimeout(step,TICK);
  };
  step();
}

function modeChase(){
  // fast hard cuts ‚Äî the single-zone version of a marquee chase
  runPattern([
    {color:'#FF0000', ms:170},
    {color:'#FFFFFF', ms:170},
    {color:'#0033CC', ms:170}
  ], false);
}

function modeFirecracker(){
  // hold red or blue, then 1-3 quick white pops at random
  const bases=[BLUE,RED];
  let bi=0;
  const loop=()=>{
    const b=bases[bi%2];
    setColor(b[0],b[1],b[2]);
    patternTimer=setTimeout(()=>{
      let pops=1+Math.floor(Math.random()*3);
      const pop=()=>{
        setColor(255,255,255);
        patternTimer=setTimeout(()=>{
          setColor(b[0],b[1],b[2]);
          pops--;
          if(pops>0) patternTimer=setTimeout(pop,90);
          else { bi++; patternTimer=setTimeout(loop,300+Math.random()*600); }
        },70);
      };
      pop();
    },400+Math.random()*700);
  };
  loop();
}

function modeStars(){
  // deep blue night with random white twinkles
  const loop=()=>{
    setColor(0,30,160);
    patternTimer=setTimeout(()=>{
      setColor(255,255,255);
      patternTimer=setTimeout(loop,80);
    },500+Math.random()*1400);
  };
  loop();
}

function modeFinale(){
  // accelerating red-white-blue strobe that builds and resets
  const cols=[RED,WHITE,BLUE];
  let i=0, delay=600;
  const step=()=>{
    const c=cols[i%3];
    setColor(c[0],c[1],c[2]);
    i++;
    delay=Math.max(90, delay*0.93);
    if(delay<=90 && i%24===0) delay=600;
    patternTimer=setTimeout(step,delay);
  };
  step();
}

const JULY_MODES=[
  {name:'Slow glow',  dots:['#FF0000','#FFFFFF','#0033CC'], run:modeSlowGlow},
  {name:'Pulse',      dots:['#FF0000','#FFFFFF','#0033CC'], run:modePulse},
  {name:'Chase',      dots:['#FF0000','#FFFFFF','#0033CC'], run:modeChase},
  {name:'Firecracker',dots:['#0033CC','#FFFFFF','#FF0000'], run:modeFirecracker},
  {name:'Starlight',  dots:['#001EA0','#FFFFFF'],           run:modeStars},
  {name:'Finale',     dots:['#FF0000','#FFFFFF','#0033CC'], run:modeFinale},
];
const julyGrid=document.getElementById('julyGrid');
JULY_MODES.forEach(m=>{
  const card=document.createElement('button');
  card.className='pattern-card';
  card.innerHTML=`${m.name}<div class="dots">${m.dots.map(c=>`<div class="dot" style="background:${c}"></div>`).join('')}</div>`;
  card.onclick=()=>{
    stopPattern();
    card.classList.add('active');
    m.run();
  };
  julyGrid.appendChild(card);
});

/* ============ canned patterns ============ */
const PRESETS = [
  {name:'Royals', colors:['#004687','#FFFFFF','#C09A5B'], ms:900, fade:false},
  {name:'Chiefs', colors:['#E31837','#FFB81C'], ms:800, fade:false},
  {name:'Jayhawks', colors:['#0051BA','#E8000D'], ms:900, fade:false},
  {name:'Current', colors:['#64CCC9','#C8102E'], ms:900, fade:false},
  {name:'Slow rainbow', colors:['#FF0000','#FF8800','#FFFF00','#00CC44','#0066FF','#FFFFFF'], ms:2200, fade:true},
  {name:'Ocean fade', colors:['#003B73','#0077B6','#64CCC9'], ms:2500, fade:true},
];
const grid = document.getElementById('patternGrid');
PRESETS.forEach(p=>{
  const card = document.createElement('button');
  card.className = 'pattern-card';
  card.innerHTML = `${p.name}<div class="dots">${p.colors.map(c=>`<div class="dot" style="background:${c}"></div>`).join('')}</div>`;
  card.onclick = ()=>{
    stopPattern();
    card.classList.add('active');
    runPattern(p.colors.map(c=>({color:c, ms:p.ms})), p.fade);
  };
  grid.appendChild(card);
});
document.getElementById('stopBtn').onclick = stopPattern;

/* ============ custom builder ============ */
const stepsEl = document.getElementById('steps');
let customSteps = [
  {color:'#004687', ms:1000},
  {color:'#C09A5B', ms:1000}
];
let fadeOn = false;

// restore saved pattern if available
try{
  const saved = JSON.parse(localStorage.getItem('customPattern'));
  if(saved && saved.steps && saved.steps.length){ customSteps = saved.steps; fadeOn = !!saved.fade; }
}catch(e){}

function saveCustom(){
  try{ localStorage.setItem('customPattern', JSON.stringify({steps:customSteps, fade:fadeOn})); }catch(e){}
}

function renderSteps(){
  stepsEl.innerHTML = '';
  customSteps.forEach((s,idx)=>{
    const row = document.createElement('div');
    row.className = 'step';
    row.innerHTML = `
      <input type="color" value="${s.color}">
      <input type="number" value="${s.ms}" min="100" step="100" inputmode="numeric">
      <span class="ms">ms</span>
      <button class="del">&times;</button>`;
    row.querySelector('input[type=color]').addEventListener('input', e=>{ customSteps[idx].color = e.target.value; saveCustom(); });
    row.querySelector('input[type=number]').addEventListener('input', e=>{ customSteps[idx].ms = Math.max(100, parseInt(e.target.value)||1000); saveCustom(); });
    row.querySelector('.del').onclick = ()=>{
      if(customSteps.length > 1){ customSteps.splice(idx,1); renderSteps(); saveCustom(); }
    };
    stepsEl.appendChild(row);
  });
  const ft = document.getElementById('fadeToggle');
  ft.className = 'toggle' + (fadeOn ? ' on' : '');
}
document.getElementById('addStep').onclick = ()=>{
  customSteps.push({color:'#FFFFFF', ms:1000});
  renderSteps(); saveCustom();
};
document.getElementById('fadeToggle').onclick = ()=>{
  fadeOn = !fadeOn; renderSteps(); saveCustom();
};
document.getElementById('runCustom').onclick = ()=>{
  stopPattern();
  runPattern(customSteps.map(s=>({...s})), fadeOn);
};
renderSteps();

/* ============ buttons ============ */
document.getElementById('connectBtn').onclick = connect;
document.getElementById('onBtn').onclick = powerOn;
document.getElementById('offBtn').onclick = powerOff;
</script>
</body>
</html>
